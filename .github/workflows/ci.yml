name: Application checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DTL_BROWSER_CHANNEL: chrome
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.25.0'
          run_install: false
      - name: Create Python environment
        run: python -m venv .venv
      - name: Install locked Python dependencies
        run: .\.venv\Scripts\python.exe -m pip install --index-url https://pypi.org/simple -r requirements.lock
      - name: Install application
        run: .\.venv\Scripts\python.exe -m pip install --index-url https://pypi.org/simple --no-deps -e .
      - name: Check Python dependency consistency
        run: .\.venv\Scripts\python.exe -m pip check
      - name: Install locked frontend dependencies
        run: pnpm install --dir frontend --frozen-lockfile
      - name: Run application and browser checks
        run: .\scripts\check.ps1 -Browser
